apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-100-things-role-template-view-small-things
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "100 件小事"
    rbac.authorization.halo.run/display-name: "查看小事清单"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:plugin-100-things:smallthing:view"]
rules:
  - apiGroups: ["hundredthings.plugin.halo.run"]
    resources: ["smallthings"]
    verbs: ["get", "list"]
  # 控制台页面一进来就要读配置（标题、开关），所以查看角色也需要 settings 的读权限。
  - apiGroups: ["console.api.hundredthings.plugin.halo.run"]
    resources: ["smallthings", "smallthings/stats", "smallthings/options", "settings"]
    verbs: ["get", "list"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-100-things-role-template-manage-small-things
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      [ "plugin-100-things-role-template-view-small-things" ]
    rbac.authorization.halo.run/module: "100 件小事"
    rbac.authorization.halo.run/display-name: "管理小事清单"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:plugin-100-things:smallthing:manage"]
rules:
  # 控制台是唯一的编辑入口：清单可以增删改（含文案），章节与页面文案存在 settings 里。
  # 前台展示页对访客只读，没有对应的写接口。
  - apiGroups: ["hundredthings.plugin.halo.run"]
    resources: ["smallthings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["console.api.hundredthings.plugin.halo.run"]
    resources: ["smallthings", "smallthings/stats", "smallthings/options", "settings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
